name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Checkout solar-commons
        uses: actions/checkout@v4
        with:
          repository: ayoub3bidi/solar-commons
          path: solar-commons
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Link solar-commons for go.mod replace
        run: |
          mkdir -p "$(dirname "$GITHUB_WORKSPACE")"
          ln -sfn "$GITHUB_WORKSPACE/solar-commons" "$(dirname "$GITHUB_WORKSPACE")/solar-commons"

      - name: Run tests
        run: |
          go test ./...
          go vet ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
