name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go test ./...
          go vet ./...

      - name: Prepare curated changelog entry
        run: |
          tag="${GITHUB_REF_NAME#v}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          python3 - "$tag" CHANGELOG.md > "$notes_file" <<'PY'
          import re
          import sys
          from pathlib import Path

          tag, path = sys.argv[1:]
          text = Path(path).read_text()
          headings = list(re.finditer(r"^## \[(?:v)?([^]]+)\].*$", text, re.MULTILINE))
          for index, heading in enumerate(headings):
              if heading.group(1) == tag:
                  start = heading.end() + 1
                  end = headings[index + 1].start() if index + 1 < len(headings) else len(text)
                  notes = text[start:end].strip()
                  if not notes:
                      raise SystemExit(f"No release notes found for v{tag}")
                  print(notes)
                  break
          else:
              raise SystemExit(f"No changelog section found for v{tag}")
          PY

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish curated changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          gh release edit "$GITHUB_REF_NAME" --repo="$GITHUB_REPOSITORY" --notes-file "$notes_file"
