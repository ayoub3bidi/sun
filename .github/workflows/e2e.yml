name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sun
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: |
          go vet ./...
          go test ./...

      - name: Integration tests (all templates)
        run: go test -tags integration -timeout 300s ./e2e/...

      - name: Checkout solar-commons
        uses: actions/checkout@v4
        with:
          repository: ayoub3bidi/solar-commons
          path: solar-commons

      - name: solar-commons template integration
        working-directory: solar-commons
        run: go test -tags integration -timeout 300s ./...
